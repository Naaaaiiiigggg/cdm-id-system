<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0E3B2A" />
  <title>CdM ID System - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           background: #F4F7F5; color: #16201B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #DDE5E0; border-radius: 20px; padding: 32px 26px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 50%; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 0; color: #5E6B64; font-size: 14px; line-height: 1.5; }
    button { margin-top: 22px; width: 100%; border: 0; border-radius: 12px; padding: 14px; background: #0E3B2A; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="CdM" />
    <h1>You're offline</h1>
    <p>The CdM ID System needs an internet connection to load your requests. Check your connection, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
